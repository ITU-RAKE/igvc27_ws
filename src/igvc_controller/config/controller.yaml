# igvc_controller ayarlari. wheel_radius / wheel_separation launch'ta igvc_macros.xacro'dan
# hesaplanip bunlarin uzerine yazilir.
igvc_controller:
  ros__parameters:
    # Skid steer etkin iz carpani: simulasyon (2 ceker + caster) 1.0. Gercek skid steer'de
    # yerinde 360 deg donus testiyle kalibre et (tipik 1.2 - 2.0).
    track_scale: 1.0
    left_wheel_joints: [left_wheel_joint]
    right_wheel_joints: [right_wheel_joint]

    max_linear_velocity: 1.5       # m/s (IGVC hiz siniri 5 mph = 2.2 m/s)
    max_angular_velocity: 2.0      # rad/s
    max_linear_acceleration: 1.0   # m/s^2
    max_angular_acceleration: 3.0  # rad/s^2
    cmd_timeout: 0.5               # s, komut kesilirse dur
    control_rate: 50.0             # Hz

    cmd_vel_topic: /cmd_vel
    wheel_command_topic: /wheel_velocity_controller/commands
    joint_states_topic: /joint_states
    odom_frame: odom
    base_frame: base_footprint
    publish_tf: true
